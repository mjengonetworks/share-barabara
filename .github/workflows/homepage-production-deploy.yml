name: Approved homepage production deployment

on:
  workflow_dispatch:
    inputs:
      rollback_version_id:
        description: "Preserved Worker version to activate for an emergency rollback"
        required: false
        type: string
        default: ""
  push:
    branches:
      - fix/homepage-horizontal-margins
      - feat/homepage-redesign
      - fix/homepage-category-discovery
      - feat/homepage-order-advertising-road-discovery
      - feat/full-road-management-article-cms-repairs
      - fix/homepage-previews-most-viewed-ads
      - fix/cms-persistence-diagnostics
      - fix/news-alerts-road-filter-runtime
      - fix/cms-editor-workspace-corrections

permissions:
  contents: read
  actions: read

concurrency:
  group: share-barabara-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && inputs.rollback_version_id == '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-approved-homepage]'))
    runs-on: ubuntu-latest
    env:
      APP_CANDIDATE_SHA: dd14e67d9b21c722749b13827913a5603ef0e9f1
      EXPECTED_PRODUCTION_APPLICATION_SHA: 0914f6cfc1ff08ec2bcaba59e776996911ec3b10
      EXPECTED_DEPLOYMENT_ID: b6e38288-dfdf-40ae-bb50-c8dce0264e77
      EXPECTED_WORKER_VERSION_ID: 8a1d45ce-a5b2-41e8-bd68-29711b259419
      EXPECTED_ARTIFACT_ID: 13921424193
      EXPECTED_ARTIFACT_RUN_ID: 43171549738
      EXPECTED_ARTIFACT_DIGEST: sha256:177f05d01002d91b05e401b444628715a450a889a1f1b03dfcb923d1a977cd4a
      WORKER_NAME: share-barabara
      CLOUDFLARE_API: https://api.cloudflare.com/client/v4

    steps:
      - name: Check out approved application candidate
        uses: actions/checkout@v4
        with:
          ref: 0914f6cfc1ff08ec2bcaba59e776996911ec3b10
          fetch-depth: 0

      - name: Confirm candidate ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_CANDIDATE_SHA"
          git fetch --no-tags origin "refs/heads/rebuild/accident-report-cms:refs/remotes/origin/rebuild/accident-report-cms"
          git cat-file -e "${EXPECTED_PRODUCTION_APPLICATION_SHA}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_PRODUCTION_APPLICATION_SHA" "$APP_CANDIDATE_SHA"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify approved artifact digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual_digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}" --jq '.digest')"
          test "$actual_digest" = "$EXPECTED_ARTIFACT_DIGEST"
          echo "Approved artifact digest verified: ${actual_digest}"

      - name: Download approved complete payload
        id: approved-artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.EXPECTED_ARTIFACT_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.EXPECTED_ARTIFACT_RUN_ID }}
          path: artifact-wrapper

      - name: Verify complete approved payload
        run: |
          set -euo pipefail
          echo "Artifact verified: id=${EXPECTED_ARTIFACT_ID} run=${EXPECTED_ARTIFACT_RUN_ID} digest=${EXPECTED_ARTIFACT_DIGEST}"
          payload_tar="$(find artifact-wrapper -type f -name '*.tar.gz' -print -quit)"
          test -n "$payload_tar"
          tar -xzf "$payload_tar" -C "$GITHUB_WORKSPACE"
          test -s .output/server/index.mjs
          test -s .output/server/wrangler.json
          test -d .output/server/_ssr
          test -d .output/server/_libs
          test -d .output/public/assets
          echo "Verified complete payload artifact ${EXPECTED_ARTIFACT_ID}"

      - name: Run full release gates on approved candidate
        run: |
          bun run test
          bun run test:security
          node --experimental-strip-types --experimental-loader ./tests/node-test-loader.mjs --test tests/ai-server-function-artifact.test.mjs

      - name: Read-only production preflight
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_READ_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
          api_get() {
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_READ_TOKEN}" \
              --header 'Content-Type: application/json' "$1"
          }
          assert_success() {
            test "$(jq -r '.success' <<<"$1")" = true || { jq -c '.errors' <<<"$1" >&2; exit 1; }
          }
          deployments="$(api_get "${CLOUDFLARE_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments?per_page=100")"
          assert_success "$deployments"
          latest="$(jq -c '.result.deployments | sort_by(.created_on) | last' <<<"$deployments")"
          previous="$(jq -c '.result.deployments | sort_by(.created_on) | .[-2]' <<<"$deployments")"
          live_deployment_id="$(jq -r '.id' <<<"$latest")"
          test "$live_deployment_id" = "$EXPECTED_DEPLOYMENT_ID"
          live_versions="$(jq -c '.versions' <<<"$latest")"
          test "$(jq '[.[].percentage] | add' <<<"$live_versions")" = 100
          live_version_id="$(jq -r '.[0].version_id' <<<"$live_versions")"
          test "$live_version_id" = "$EXPECTED_WORKER_VERSION_ID"
          rollback_version_id="$(jq -r '.versions[0].version_id' <<<"$previous")"
          test -n "$rollback_version_id" -a "$rollback_version_id" != "$live_version_id"
          domains="$(api_get "${CLOUDFLARE_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?zone_name=sharebarabara.co.ke")"
          assert_success "$domains"
          domain="$(jq -c '.result[] | select(.hostname == "sharebarabara.co.ke" and .service == "share-barabara" and (.enabled // true) == true)' <<<"$domains" | head -n 1)"
          test -n "$domain"
          settings="$(api_get "${CLOUDFLARE_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")"
          assert_success "$settings"
          binding_names="$(jq -r '.result.bindings[]?.name // empty' <<<"$settings" | sort -u)"
          grep -qx ASSETS <<<"$binding_names"
          grep -qx AI_RATE_LIMITER <<<"$binding_names"
          schedules="$(api_get "${CLOUDFLARE_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/schedules")"
          assert_success "$schedules"
          jq -e 'any(.result.schedules[]?; .cron == "*/1 * * * *")' <<<"$schedules" >/dev/null
          {
            echo "Pre-deployment deployment=${live_deployment_id} version=${live_version_id} traffic=${live_versions}"
            echo "Pre-deployment rollback deployment=$(jq -r '.id' <<<"$previous") version=${rollback_version_id}"
            echo "Pre-deployment application baseline=${EXPECTED_PRODUCTION_APPLICATION_SHA}"
            echo 'Pre-deployment read-only checks passed; secrets not exposed'
          } | tee predeployment-state.txt

      - name: Validate effective production configuration
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const c = JSON.parse(await readFile(".output/server/wrangler.json", "utf8"));
            if (c.name !== "share-barabara") throw new Error("unexpected Worker name");
            if (c.vars?.DEPLOYMENT_ENV !== "production") throw new Error("unexpected deployment environment");
            if (!c.routes?.some((r) => r.pattern === "sharebarabara.co.ke" && r.custom_domain === true && r.enabled === true)) throw new Error("production custom domain missing");
            if (!c.triggers?.crons?.includes("*/1 * * * *")) throw new Error("production cron missing");
            if (c.assets?.binding !== "ASSETS" || c.ratelimits?.[0]?.name !== "AI_RATE_LIMITER") throw new Error("required binding metadata missing");
            console.log("Effective production config validated: name, domain, ASSETS, AI_RATE_LIMITER, production vars and cron");
          '

      - name: Deploy approved payload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-production.mjs

      - name: Verify deployment and public health
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api_get() { curl --fail-with-body --silent --show-error --header "Authorization: Bearer ${CLOUDFLARE_READ_TOKEN}" --header 'Content-Type: application/json' "$1"; }
          assert_success() { test "$(jq -r '.success' <<<"$1")" = true || { jq -c '.errors' <<<"$1" >&2; exit 1; }; }
          deployments="$(api_get "${CLOUDFLARE_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments?per_page=100")"
          assert_success "$deployments"
          latest="$(jq -c '.result.deployments | sort_by(.created_on) | last' <<<"$deployments")"
          new_deployment_id="$(jq -r '.id' <<<"$latest")"
          new_versions="$(jq -c '.versions' <<<"$latest")"
          new_version_id="$(jq -r '.[0].version_id' <<<"$new_versions")"
          test "$new_deployment_id" != "$EXPECTED_DEPLOYMENT_ID"
          test "$new_version_id" != "$EXPECTED_WORKER_VERSION_ID"
          test "$(jq '[.[].percentage] | add' <<<"$new_versions")" = 100
          echo "Post-deployment deployment=${new_deployment_id} version=${new_version_id} traffic=${new_versions}"
          for path in / /news /alerts /reports /campaigns /infrastructure-issues; do
            code="$(curl --retry 2 --silent --show-error --output /dev/null --write-out '%{http_code}' "https://sharebarabara.co.ke${path}")"
            test "$code" = 200
            echo "Health ${path}: HTTP ${code}"
          done
          echo 'Browser visual/responsive and console acceptance: pending; no browser surface is available in this workflow'
          {
            echo "Post-deployment deployment=${new_deployment_id} version=${new_version_id} traffic=${new_versions}"
            echo 'Public health checks: / /news /alerts /reports /campaigns /infrastructure-issues all HTTP 200'
            echo 'Browser visual/responsive acceptance: pending owner verification'
          } | tee deployment-result.txt

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_version_id != ''
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API: https://api.cloudflare.com/client/v4
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: share-barabara
      CURRENT_VERSION_ID: 8a1d45ce-a5b2-41e8-bd68-29711b259419
      ROLLBACK_VERSION_ID: ${{ inputs.rollback_version_id }}
    steps:
      - name: Confirm current production before rollback
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_READ_TOKEN:?read token required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?account id required}"
          deployments="$(curl --fail-with-body --silent --show-error --header "Authorization: Bearer ${CLOUDFLARE_READ_TOKEN}" --header 'Content-Type: application/json' "${CLOUDFLARE_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments?per_page=100")"
          test "$(jq -r '.success' <<<"$deployments")" = true
          latest="$(jq -c '.result.deployments | sort_by(.created_on) | last' <<<"$deployments")"
          live_version="$(jq -r '.versions[0].version_id' <<<"$latest")"
          traffic="$(jq '[.versions[].percentage] | add' <<<"$latest")"
          test "$live_version" = "$CURRENT_VERSION_ID"
          test "$traffic" = 100
          echo "Confirmed rollback source version=${live_version} traffic=${traffic}%"

      - name: Activate preserved Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: npx wrangler rollback "$ROLLBACK_VERSION_ID" --name "$WORKER_NAME" --message "emergency homepage regression rollback" --yes

      - name: Verify rollback and public health
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          deployments="$(curl --fail-with-body --silent --show-error --header "Authorization: Bearer ${CLOUDFLARE_READ_TOKEN}" --header 'Content-Type: application/json' "${CLOUDFLARE_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments?per_page=100")"
          test "$(jq -r '.success' <<<"$deployments")" = true
          latest="$(jq -c '.result.deployments | sort_by(.created_on) | last' <<<"$deployments")"
          live_version="$(jq -r '.versions[0].version_id' <<<"$latest")"
          traffic="$(jq '[.versions[].percentage] | add' <<<"$latest")"
          test "$live_version" = "$ROLLBACK_VERSION_ID"
          test "$traffic" = 100
          for path in / /news /alerts /reports /feed; do
            code="$(curl --retry 2 --silent --show-error --output /dev/null --write-out '%{http_code}' "https://sharebarabara.co.ke${path}")"
            test "$code" = 200
            echo "Health ${path}: HTTP ${code}"
          done
          echo "Rollback verified: version=${live_version} traffic=${traffic}%"
