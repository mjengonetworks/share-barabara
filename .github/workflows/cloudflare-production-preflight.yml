name: Cloudflare production preflight

on:
  workflow_dispatch:
  push:
    branches:
      - fix/homepage-horizontal-margins

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API: https://api.cloudflare.com/client/v4
      WORKER_NAME: share-barabara
      EXPECTED_DEPLOYMENT_ID: a27e1959-4e15-4753-b9c7-0f2e86d6826f
      EXPECTED_APPLICATION_SHA: 7b3054e070d77a8e721ec67b5de24a902e37f382
      EXPECTED_ARTIFACT_ID: 13403623435
      EXPECTED_ARTIFACT_RUN_ID: 42005270770

    steps:
      - name: Check out preflight revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify candidate and GitHub artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse --is-shallow-repository)" = false
          git cat-file -e "${EXPECTED_APPLICATION_SHA}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_APPLICATION_SHA" HEAD
          changed_files="$(git diff --name-only "$EXPECTED_APPLICATION_SHA" HEAD)"
          unexpected_files="$(printf '%s\n' "$changed_files" | grep -v '^\.github/workflows/' || true)"
          if [ -n "$unexpected_files" ]; then
            echo "Unexpected files differ from the approved application candidate:" >&2
            echo "$unexpected_files" >&2
            exit 1
          fi

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_ARTIFACT_RUN_ID}")"
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          test "$(jq -r '.head_branch' <<<"$run_json")" = fix/homepage-horizontal-margins
          run_sha="$(jq -r '.head_sha' <<<"$run_json")"
          git cat-file -e "${run_sha}^{commit}"
          run_unexpected_files="$(git diff --name-only "$EXPECTED_APPLICATION_SHA" "$run_sha" | grep -v '^\.github/workflows/homepage-release-verification.yml$' || true)"
          test -z "$run_unexpected_files"

          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_ARTIFACT_RUN_ID}/artifacts")"
          artifact="$(jq -c --arg id "$EXPECTED_ARTIFACT_ID" '.artifacts[] | select((.id|tostring) == $id)' <<<"$artifact_json")"
          test -n "$artifact"
          test "$(jq -r '.expired' <<<"$artifact")" = false
          test "$(jq -r '.size_in_bytes' <<<"$artifact")" -gt 0
          echo "Verified GitHub artifact ${EXPECTED_ARTIFACT_ID}: $(jq -r '.name' <<<"$artifact")"
          echo "Artifact digest: $(jq -r '.digest' <<<"$artifact")"
          echo "Application candidate: ${EXPECTED_APPLICATION_SHA}"

      - name: Query Cloudflare production read-only state
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"

          api_get() {
            local url="$1" response_file http_status body
            response_file="$(mktemp)"
            http_status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              "$url")" || {
                echo "Cloudflare request transport failure: endpoint=$url http_status=${http_status:-unknown}" >&2
                jq -c '{success,errors,messages}' "$response_file" >&2 || true
                rm -f "$response_file"
                return 1
              }
            body="$(cat "$response_file")"
            rm -f "$response_file"
            if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
              echo "Cloudflare request failed: endpoint=$url http_status=$http_status" >&2
              jq -c '{success,errors,messages}' <<<"$body" >&2 || true
              return 1
            fi
            printf '%s' "$body"
          }

          require_equal() {
            local label="$1" expected="$2" actual="$3"
            if [ "$actual" != "$expected" ]; then
              echo "Preflight assertion failed: ${label}; expected=${expected}; actual=${actual}" >&2
              return 1
            fi
          }

          require_nonempty() {
            local label="$1" actual="$2"
            if [ -z "$actual" ] || [ "$actual" = null ]; then
              echo "Preflight assertion failed: ${label}; actual=${actual:-empty}" >&2
              return 1
            fi
          }

          assert_success() {
            if [ "$(jq -r '.success' <<<"$1")" != true ]; then
              echo "Cloudflare API request failed" >&2
              jq -c '.errors' <<<"$1" >&2
              exit 1
            fi
          }

          deployments="$(api_get "${CLOUDFLARE_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments?per_page=100")"
          assert_success "$deployments"
          deployment_count="$(jq '.result.deployments | length' <<<"$deployments")"
          echo "Cloudflare deployments response: count=${deployment_count}"
          if [ "$deployment_count" -lt 2 ]; then
            echo "Preflight assertion failed: at least two deployments required; actual=${deployment_count}" >&2
            exit 1
          fi
          latest="$(jq -c '.result.deployments | sort_by(.created_on) | last' <<<"$deployments")"
          previous="$(jq -c '.result.deployments | sort_by(.created_on) | .[-2]' <<<"$deployments")"
          live_deployment_id="$(jq -r '.id' <<<"$latest")"
          echo "Cloudflare live deployment: id=${live_deployment_id}"
          baseline_matches=true
          if [ "$live_deployment_id" != "$EXPECTED_DEPLOYMENT_ID" ]; then
            baseline_matches=false
            echo "Production baseline differs: expected deployment=${EXPECTED_DEPLOYMENT_ID}; actual deployment=${live_deployment_id}" >&2
          fi

          live_versions="$(jq -c '.versions' <<<"$latest")"
          traffic_total="$(jq '[.[].percentage] | add' <<<"$live_versions")"
          echo "Cloudflare live traffic: versions=${live_versions} total=${traffic_total}%"
          require_equal 'live traffic total' 100 "$traffic_total"
          live_version_id="$(jq -r '.[0].version_id' <<<"$live_versions")"
          require_nonempty 'live version ID' "$live_version_id"
          rollback_version_id="$(jq -r '.versions[0].version_id' <<<"$previous")"
          require_nonempty 'rollback version ID' "$rollback_version_id"
          if [ "$rollback_version_id" = "$live_version_id" ]; then
            echo "Preflight assertion failed: rollback version must differ from live version; version=${live_version_id}" >&2
            exit 1
          fi
          live_source="$(jq -r '.source // "unknown"' <<<"$latest")"
          live_annotations="$(jq -c '.annotations // {}' <<<"$latest")"
          echo "Cloudflare live deployment metadata: source=${live_source} annotations=${live_annotations}"

          version_detail="$(api_get "${CLOUDFLARE_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${live_version_id}")"
          assert_success "$version_detail"
          echo "Cloudflare live version metadata: $(jq -c '{id: .result.id, number: .result.number, created_on: .result.created_on, metadata: {source: .result.metadata.source, author_email: .result.metadata.author_email, annotations: .result.metadata.annotations}}' <<<"$version_detail")"

          zone="$(api_get "${CLOUDFLARE_API}/zones?name=sharebarabara.co.ke&status=active&per_page=1")"
          assert_success "$zone"
          zone_id="$(jq -r '.result[0].id // empty' <<<"$zone")"
          test -n "$zone_id"

          routes="$(api_get "${CLOUDFLARE_API}/zones/${zone_id}/workers/routes")"
          assert_success "$routes"
          route_summary="$(jq -c '[.result[] | {id,pattern,script,enabled}]' <<<"$routes")"
          route="$(jq -c --arg script "$WORKER_NAME" '.result[] | select(.pattern == "sharebarabara.co.ke" and .script == $script and (.enabled // true) == true)' <<<"$routes" | head -n 1)"
          echo "Cloudflare route metadata: ${route_summary}"
          if [ -z "$route" ]; then
            echo 'Preflight configuration warning: expected exact route was not found' >&2
          fi

          domains="$(api_get "${CLOUDFLARE_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?zone_name=sharebarabara.co.ke")"
          assert_success "$domains"
          domain_summary="$(jq -c '[.result[] | {id,hostname,service,environment,enabled}]' <<<"$domains")"
          domain="$(jq -c '.result[] | select(.hostname == "sharebarabara.co.ke" and (.enabled // true) == true)' <<<"$domains" | head -n 1)"
          echo "Cloudflare custom-domain metadata: ${domain_summary}"
          if [ -z "$domain" ]; then
            echo 'Preflight configuration warning: expected exact custom domain was not found' >&2
          fi

          settings="$(api_get "${CLOUDFLARE_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")"
          assert_success "$settings"
          binding_metadata="$(jq -c '[.result.bindings[]? | {name,type}]' <<<"$settings")"
          binding_names="$(jq -r '.result.bindings[]?.name // empty' <<<"$settings" | sort -u)"
          echo "Cloudflare binding metadata: ${binding_metadata}"
          if ! grep -qx 'ASSETS' <<<"$binding_names"; then
            echo 'Preflight configuration warning: ASSETS binding not found' >&2
          fi
          if ! grep -qx 'AI_RATE_LIMITER' <<<"$binding_names"; then
            echo 'Preflight configuration warning: AI_RATE_LIMITER binding not found' >&2
          fi

          schedules="$(api_get "${CLOUDFLARE_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/schedules")"
          assert_success "$schedules"
          cron_summary="$(jq -c '.result.schedules // []' <<<"$schedules")"
          echo "Cloudflare cron schedules: ${cron_summary}"

          {
            echo '## Cloudflare production preflight'
            echo
            echo "- Live deployment ID: ${live_deployment_id}"
            echo "- Live version ID: ${live_version_id}"
            echo "- Live traffic: ${live_versions} (total ${traffic_total}%)"
            echo "- Rollback deployment ID: $(jq -r '.id' <<<"$previous")"
            echo "- Rollback version ID: ${rollback_version_id}"
            echo "- Route: $(jq -c '.' <<<"$route")"
            echo "- Custom domain: $(jq -c '.' <<<"$domain")"
            echo "- Binding names only: $(tr '\n' ',' <<<"$binding_names" | sed 's/,$//')"
            echo "- Cron schedules: $(jq -c '.result.schedules' <<<"$schedules")"
            echo '- Secret values: not requested or exposed'
            echo '- Mutating Cloudflare API calls: none'
            if [ "$baseline_matches" = true ]; then
              echo '- Deployment readiness: configuration preflight passed; separate deployment approval required'
            else
              echo '- Deployment readiness: blocked; production deployment baseline differs from expected'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
