name: Homepage release verification

on:
  workflow_dispatch:
  push:
    branches:
      - fix/homepage-grid-width
      - feat/media-feed-visual-system
      - feat/homepage-redesign
      - fix/homepage-category-discovery
      - fix/homepage-density-discovery
      - feat/homepage-order-advertising-road-discovery

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_CANDIDATE_SHA: 9643a24

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: 9643a24
          fetch-depth: 0

      - name: Confirm exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$APP_CANDIDATE_SHA"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production artifacts
        run: bun run build

      - name: Verify Worker artifacts
        run: |
          test -s .output/server/index.mjs
          test -s .output/server/wrangler.json

      - name: Run full test suite
        run: bun run test

      - name: Run security tests
        run: bun run test:security

      - name: Run artifact-dependent test
        run: |
          node --experimental-strip-types --experimental-loader ./tests/node-test-loader.mjs --test tests/ai-server-function-artifact.test.mjs
          RUN_PRODUCTION_ARTIFACT_GATE=1 node --experimental-strip-types --experimental-loader ./tests/node-test-loader.mjs --test tests/production-preview-exclusion-artifact.test.mjs

      - name: Validate and package complete Worker payload
        run: |
          set -euo pipefail
          test -s .output/server/index.mjs
          test -s .output/server/wrangler.json
          test -d .output/server/_ssr
          test -d .output/server/_libs
          test -d .output/public/assets
          tar -czf "homepage-worker-payload-${APP_CANDIDATE_SHA}.tar.gz" .output
          payload_files="$(tar -tzf "homepage-worker-payload-${APP_CANDIDATE_SHA}.tar.gz")"
          grep -Fx '.output/server/index.mjs' <<<"$payload_files"
          grep -Fx '.output/server/wrangler.json' <<<"$payload_files"
          grep -q '^.output/server/_ssr/' <<<"$payload_files"
          grep -q '^.output/public/assets/' <<<"$payload_files"

      - name: Upload complete Worker payload
        uses: actions/upload-artifact@v4
        with:
          name: homepage-worker-payload-${{ env.APP_CANDIDATE_SHA }}
          path: homepage-worker-payload-${{ env.APP_CANDIDATE_SHA }}.tar.gz
          if-no-files-found: error
          retention-days: 7
