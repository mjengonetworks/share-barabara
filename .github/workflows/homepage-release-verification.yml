name: Homepage release verification

on:
  workflow_dispatch:
  push:
    branches:
      - fix/homepage-horizontal-margins

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production artifacts
        run: bun run build

      - name: Verify Worker artifacts
        run: |
          test -s .output/server/index.mjs
          test -s .output/server/wrangler.json

      - name: Run full test suite
        run: bun run test

      - name: Run security tests
        run: bun run test:security

      - name: Run artifact-dependent test
        run: node --experimental-strip-types --experimental-loader ./tests/node-test-loader.mjs --test tests/ai-server-function-artifact.test.mjs

      - name: Upload Worker artifacts
        uses: actions/upload-artifact@v4
        with:
          name: homepage-worker-artifacts-${{ github.sha }}
          path: |
            .output/server/index.mjs
            .output/server/wrangler.json
          if-no-files-found: error
          retention-days: 3
